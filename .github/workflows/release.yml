name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      tag_exists: ${{ steps.check_tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current version
        id: current
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Bump patch version
        id: bump
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          IFS='.' read -ra PARTS <<< "$CURRENT"
          MAJOR=${PARTS[0]}
          MINOR=${PARTS[1]}
          PATCH=${PARTS[2]}
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.bump.outputs.new_version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: bump-version
    if: needs.bump-version.outputs.tag_exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install

      - name: Update version in package.json
        run: |
          jq '.version = "${{ needs.bump-version.outputs.new_version }}"' package.json > tmp.json && mv tmp.json package.json
          jq '.version = "${{ needs.bump-version.outputs.new_version }}"' apps/desktop/package.json > tmp.json && mv tmp.json apps/desktop/package.json

      - name: Update version in tauri.conf.json
        run: |
          jq '.version = "${{ needs.bump-version.outputs.new_version }}"' apps/desktop/src-tauri/tauri.conf.json > tmp.json && mv tmp.json apps/desktop/src-tauri/tauri.conf.json

      - name: Update version in Cargo.toml
        shell: bash
        run: |
          sed -i.bak 's/^version = ".*"/version = "${{ needs.bump-version.outputs.new_version }}"/' apps/desktop/src-tauri/Cargo.toml
          rm -f apps/desktop/src-tauri/Cargo.toml.bak

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}-${{ matrix.target || 'default' }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/

  release:
    needs: [bump-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Collect release assets
        id: collect
        run: |
          mkdir -p release-assets
          
          # Find and copy all release files including signatures
          find artifacts -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" -o -name "*.AppImage" -o -name "*.AppImage.sig" -o -name "*.deb" -o -name "*.msi" -o -name "*.msi.sig" -o -name "*.exe" -o -name "*.nsis.zip" -o -name "*.nsis.zip.sig" \) -exec cp {} release-assets/ \;
          
          ls -la release-assets/

      - name: Generate latest.json for updater
        run: |
          VERSION="${{ needs.bump-version.outputs.new_version }}"
          
          # Initialize the platforms object
          PLATFORMS='{}'
          
          # Check for macOS aarch64 bundle (versioned or unversioned)
          MAC_AARCH64_BUNDLE=""
          if [ -f "release-assets/spaces_${VERSION}_aarch64.app.tar.gz" ]; then
            MAC_AARCH64_BUNDLE="spaces_${VERSION}_aarch64.app.tar.gz"
          elif [ -f "release-assets/spaces.app.tar.gz" ]; then
            MAC_AARCH64_BUNDLE="spaces.app.tar.gz"
          fi
          
          if [ -n "$MAC_AARCH64_BUNDLE" ]; then
            SIG=$(cat "release-assets/${MAC_AARCH64_BUNDLE}.sig" 2>/dev/null || echo "")
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg sig "$SIG" --arg url "https://github.com/hosenur/spaces/releases/download/v${VERSION}/${MAC_AARCH64_BUNDLE}" \
              '. + {"darwin-aarch64": {"signature": $sig, "url": $url}}')
          fi
          
          # Check for macOS x86_64 bundle
          if [ -f "release-assets/spaces_${VERSION}_x64.app.tar.gz" ]; then
            SIG=$(cat "release-assets/spaces_${VERSION}_x64.app.tar.gz.sig" 2>/dev/null || echo "")
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg sig "$SIG" --arg url "https://github.com/hosenur/spaces/releases/download/v${VERSION}/spaces_${VERSION}_x64.app.tar.gz" \
              '. + {"darwin-x86_64": {"signature": $sig, "url": $url}}')
          fi
          
          # Check for Windows NSIS bundle
          if [ -f "release-assets/spaces_${VERSION}_x64-setup.nsis.zip" ]; then
            SIG=$(cat "release-assets/spaces_${VERSION}_x64-setup.nsis.zip.sig" 2>/dev/null || echo "")
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg sig "$SIG" --arg url "https://github.com/hosenur/spaces/releases/download/v${VERSION}/spaces_${VERSION}_x64-setup.nsis.zip" \
              '. + {"windows-x86_64": {"signature": $sig, "url": $url}}')
          fi
          
          # Check for Linux AppImage
          if [ -f "release-assets/spaces_${VERSION}_amd64.AppImage" ]; then
            SIG=$(cat "release-assets/spaces_${VERSION}_amd64.AppImage.sig" 2>/dev/null || echo "")
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg sig "$SIG" --arg url "https://github.com/hosenur/spaces/releases/download/v${VERSION}/spaces_${VERSION}_amd64.AppImage" \
              '. + {"linux-x86_64": {"signature": $sig, "url": $url}}')
          fi
          
          # Create the final latest.json
          echo "{\"version\": \"v${VERSION}\", \"notes\": \"See release notes on GitHub\", \"pub_date\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"platforms\": $PLATFORMS}" | jq . > release-assets/latest.json
          
          cat release-assets/latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.bump-version.outputs.new_version }}
          name: Release v${{ needs.bump-version.outputs.new_version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version files and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Update package.json
          jq '.version = "${{ needs.bump-version.outputs.new_version }}"' package.json > tmp.json && mv tmp.json package.json
          jq '.version = "${{ needs.bump-version.outputs.new_version }}"' apps/desktop/package.json > tmp.json && mv tmp.json apps/desktop/package.json
          
          # Update tauri.conf.json
          jq '.version = "${{ needs.bump-version.outputs.new_version }}"' apps/desktop/src-tauri/tauri.conf.json > tmp.json && mv tmp.json apps/desktop/src-tauri/tauri.conf.json
          
          # Update Cargo.toml
          sed -i 's/^version = ".*"/version = "${{ needs.bump-version.outputs.new_version }}"/' apps/desktop/src-tauri/Cargo.toml
          
          git add package.json apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json apps/desktop/src-tauri/Cargo.toml
          git commit -m "chore: bump version to ${{ needs.bump-version.outputs.new_version }}" || echo "No changes to commit"
          git push
